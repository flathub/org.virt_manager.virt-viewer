app-id: org.virt_manager.virt-viewer
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: remote-viewer
copy-icon: true
rename-icon: virt-viewer
rename-desktop-file: org.virt-manager.virt-viewer.desktop
rename-appdata-file: org.virt-manager.virt-viewer.appdata.xml
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=ssh-auth
  - --device=all
  - --share=ipc
  - --share=network
  - --filesystem=xdg-run/libvirt
cleanup:
  - "/include"
  - "/sbin"
  - "/lib/pkgconfig"
  - "/share/man"
  - "/share/gtk-doc"
  - "/share/gir-*"
  - "/share/pkgconfig"
  - "*.la"
  - "*.a"
modules:
  - name: gtk-vnc
    buildsystem: meson
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtk-vnc/1.5/gtk-vnc-1.5.0.tar.xz
        sha256: c0beb4747528ad931da43acc567c6a0190f7fc624465571ed9ccece02c34dd23
  - name: libvirt-glib
    buildsystem: meson
    sources:
      - type: archive
        url: https://libvirt.org/sources/glib/libvirt-glib-5.0.0.tar.xz
        sha256: 9bfec346382416a3575d87299bc641b2a464aa519fd9b1287e318aa43a2f3b8b
    modules:
      - name: libtirpc
        config-opts:
          - "--disable-gssapi"
          - "--libdir=/app/lib"
        sources:
          - type: archive
            url: >-
              https://downloads.sourceforge.net/sourceforge/libtirpc/libtirpc-1.3.7.tar.bz2
            sha256: b47d3ac19d3549e54a05d0019a6c400674da716123858cfdb6d3bdd70a66c702
      - name: rpcsvc-proto
        buildsystem: autotools
        sources:
          - type: archive
            url: https://github.com/thkukuk/rpcsvc-proto/archive/v1.4.4.tar.gz
            sha256: 7988641deae8463303b6273d7af98ece09111c385d4c9134a142a5fad3cdfef8
      - name: libvirt
        builddir: true
        buildsystem: meson
        config-opts:
          - "-Dbash_completion=disabled"
          - "-Dtests=disabled"
          - "-Ddocs=disabled"
          - "-Dstorage_dir=disabled"
          - "-Dstorage_fs=disabled"
          - "-Dstorage_lvm=disabled"
          - "-Dstorage_iscsi=disabled"
          - "-Dstorage_scsi=disabled"
          - "-Dstorage_mpath=disabled"
          - "-Dstorage_disk=disabled"
          - "-Dstorage_rbd=disabled"
          - "-Dstorage_gluster=disabled"
          - "-Dstorage_zfs=disabled"
          - "-Dstorage_vstorage=disabled"
        sources:
          - type: archive
            url: https://download.libvirt.org/libvirt-12.1.0.tar.xz
            sha256: 3b60040a3670ec014d058ed021ae641e9fa6d3b5c4b56e63e8928f1804ef4b9b
  - name: spice-gtk
    buildsystem: meson
    build-options:
      env:
        PYTHONPATH: /app
    config-opts:
      - "-Dvapi=enabled"
      - "-Dwebdav=enabled"
      - "-Dgtk_doc=disabled"
      - "-Dusbredir=disabled"
      - "-Dpolkit=disabled"
    sources:
      - type: archive
        url: >-
          https://gitlab.freedesktop.org/spice/spice-gtk/uploads/e41347144c5d2f9947e215c894969f0e/spice-gtk-0.42.tar.xz
        sha256: 9380117f1811ad1faa1812cb6602479b6290d4a0d8cc442d44427f7f6c0e7a58
    modules:
      - name: spice-protocol
        buildsystem: meson
        sources:
          - type: archive
            url: >-
              https://www.spice-space.org/download/releases/spice-protocol-0.14.5.tar.xz
            sha256: baf58449f6e89d19f475899ad5fb9196fdc46c03cc53233f4e39cf2978f9cff7
      - name: phodav
        buildsystem: meson
        config-opts:
          - -Dsystemdsystemunitdir=lib/systemd/system
          - -Dudevrulesdir=lib/udev/rules.d
        sources:
          - type: archive
            url: https://download.gnome.org/sources/phodav/3.0/phodav-3.0.tar.xz
            sha256: 392ec2d06d50300dcff1ef269a2a985304e29bce3520002fca29f2edc1d138d1
      - name: libcacard
        sources:
          - type: archive
            url: >-
              https://www.spice-space.org/download/libcacard/libcacard-2.8.2.tar.xz
            sha256: 45fc28a6ff3c7a359d4448132ca190f0a9c760540c445dba4597a5b71de40f68
      - name: python-pyparsing
        buildsystem: simple
        build-commands:
          - pip3 install --prefix=/app pyparsing-3.3.2-py3-none-any.whl
        sources:
          - type: file
            url: >-
              https://files.pythonhosted.org/packages/10/bd/c038d7cc38edc1aa5bf91ab8068b63d4308c66c4c8bb3cbba7dfbc049f9c/pyparsing-3.3.2-py3-none-any.whl
            sha256: 850ba148bd908d7e2411587e247a1e4f0327839c40e2e5e6d05a007ecc69911d
      - name: python-six
        buildsystem: simple
        build-commands:
          - pip3 install --prefix=/app six-1.17.0-py2.py3-none-any.whl
        sources:
          - type: file
            url: >-
              https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
            sha256: 4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
  - name: virt-viewer
    buildsystem: meson
    post-install:
      - mv "${FLATPAK_DEST}/share/mime/packages/virt-viewer-mime.xml" "${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}.xml"
      - mv ../remote-viewer.appdata.xml "${FLATPAK_DEST}/share/metainfo/org.virt-manager.virt-viewer.appdata.xml"
    sources:
      - type: archive
        url: https://gitlab.com/virt-viewer/virt-viewer/-/archive/e07dbc915b320f70c6857ea845a67f2843848825/virt-viewer-e07dbc915b320f70c6857ea845a67f2843848825.tar.gz
        sha256: a1bce34a389091eefb8b75130f5cc751538a8d9e00388ff3f4e63dbb9a0664d0
      - type: file
        path: remote-viewer.appdata.xml
        dest: .
